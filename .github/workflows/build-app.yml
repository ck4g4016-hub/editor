name: build-app

# 把正式程式打包成 Windows 綠色版並發布。
#
# 用 onedir 不用 onefile：onefile 每次啟動都要把上百 MB 解壓到暫存資料夾，
# 開啟明顯變慢；環境探測確認過兩種都能執行，所以選快的那個。
on:
  push:
    branches: ['main', 'claude/**']
    paths:
      - 'app.py'
      - 'pipeline/**'
      - 'tools/**'
      - 'editor/**'
      - 'data/**'
      - '說明.txt'
      - 'requirements.txt'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        shell: pwsh
        run: |
          # 預設只有最後一個指令的結束碼算數，中間的 pip 裝失敗會被吃掉
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.15.0 pyinstaller-hooks-contrib

      - name: 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pyinstaller --onedir --name 紙本轉excel `
            --collect-all rapidocr_onnxruntime `
            --collect-all onnxruntime `
            --collect-all cv2 `
            --collect-all numpy `
            --collect-all pymupdf `
            --add-data "editor;editor" `
            --add-data "data;data" `
            --hidden-import tools.review `
            --hidden-import tools.template_editor `
            app.py
          Copy-Item 說明.txt dist\紙本轉excel\

      - name: 檢查打包內容
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'dist\紙本轉excel'
          foreach ($item in @('紙本轉excel.exe', '說明.txt',
                              '_internal\editor\page.html', '_internal\editor\review.html',
                              '_internal\data\roads-三峽-鶯歌.txt')) {
              if (-not (Test-Path (Join-Path $root $item))) { throw "打包後少了 $item" }
          }
          # 指名要哪三個模型。只數 *.onnx 的話會把 onnxruntime 自帶的測試模型
          # (logreg_iris、mul_1、sigmoid) 算進去，OCR 模型漏收也照樣通過。
          foreach ($model in @('ch_PP-OCRv4_det_infer.onnx',
                               'ch_PP-OCRv4_rec_infer.onnx',
                               'ch_ppocr_mobile_v2.0_cls_infer.onnx')) {
              $found = Get-ChildItem -Recurse $root -Filter $model
              if (-not $found) { throw "OCR 模型 $model 沒有包進去" }
              Write-Host ("   {0}  {1:N1} MB" -f $found[0].Name, ($found[0].Length/1MB))
          }
          $size = (Get-ChildItem -Recurse $root | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("整包大小 {0:N0} MB" -f $size)

      - name: 打包成 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # 檔名用純英數 —— GitHub 的 Release 附件會把非 ASCII 濾掉，
          # 「紙本轉excel.zip」上傳後會變成「excel.zip」，看起來像壞掉的檔案。
          Compress-Archive -Path dist\紙本轉excel -DestinationPath release\paper2excel.zip
          Get-ChildItem release | ForEach-Object {
              Write-Host ("{0}  {1:N0} MB" -f $_.Name, ($_.Length/1MB)) }

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: release/
          retention-days: 30

      - name: 發布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag --repo $env:GITHUB_REPOSITORY 2>$null
          gh release create app-latest release\paper2excel.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "紙本轉 Excel" `
            --notes-file 說明.txt
